name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip
        run: |
          if [ -f cloakmod.zip ]; then
            unzip -q cloakmod.zip -d /tmp/x
            rsync -a --exclude .github /tmp/x/cloakmod/ ./
            rm cloakmod.zip
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add -A
            git commit -m "Unpack cloakmod.zip"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: cloakmod
          path: build/libs/*.jar
